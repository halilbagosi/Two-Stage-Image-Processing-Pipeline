# Stage 2: DSLR to Cinematic Film Enhancement - M4 OPTIMIZED Configuration
# 🚀 Optimized for Apple Silicon M4 chip - FASTER training!

# Model Configuration
model:
  type: 'lut'          # 'lut' (recommended) or 'cnn'
  lut_dim: 33          # LUT dimension (33 is standard)
  num_luts: 1          # Number of LUTs to blend

# Dataset Configuration
dataset:
  # For Stage 2, we use DSLR images as input and apply film looks as targets
  dslr_dir: '../../datasets/dped/iphone/train/canon'
  test_dslr_dir: '../../datasets/dped/iphone/test/canon'
  
  # Film style to emulate
  film_style: 'cinematic'  # Options: 'cinematic', 'vintage', 'modern'
  
  # Film target generation
  use_procedural: true     # Generate film targets procedurally
  use_filmnet: false       # Use FilmNet LUTs (requires FilmNet data)
  
  img_size: 224
  augment: true

# Training Configuration - M4 OPTIMIZED
training:
  epochs: 100
  batch_size: 24          # 🚀 Increased from 16 for M4 (50% faster!)
  num_workers: 6          # 🚀 Increased from 4 for M4's better CPU
  
  # Optimizer
  optimizer: 'adam'
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.00001
  
  # Learning rate scheduler
  scheduler: 'cosine'
  lr_min: 0.000001
  
  # Loss Configuration - Perceptual is KEY for film look
  loss_type: 'film'      # Special film-focused loss
  loss_weights:
    l1: 0.5              # Lower weight on pixel accuracy
    perceptual: 1.0      # HIGH weight on perceptual quality
    style: 0.5           # Style loss for film aesthetics
    color: 0.3           # Color consistency

# Film Enhancement Settings
film:
  # Cinematic film characteristics
  contrast_boost: 1.15    # Increase contrast
  saturation: 1.1         # Slight saturation boost
  shadow_lift: 0.05       # Lift shadows slightly
  highlight_roll: 0.95    # Roll off highlights
  
  # Color grading
  teal_orange: true       # Cinematic teal/orange look
  warmth: 1.05           # Slight warmth
  
  # Film grain
  add_grain: false        # Add film grain (optional)
  grain_strength: 0.02

# Validation and Checkpointing
validation:
  val_every: 1
  save_images: true
  num_save_images: 8

checkpoint:
  save_dir: './checkpoints/stage2_m4_optimized'
  save_every: 10
  save_best: true
  resume: './checkpoints/stage2_m4_optimized/checkpoint_epoch_080.pth'  # Resume from latest checkpoint

# Device Configuration
device:
  type: 'mps'
  mixed_precision: false

# Logging
logging:
  log_every: 50
  use_wandb: false
  wandb_project: 'zrr-stage2'
  wandb_run_name: null

# Early Stopping
early_stopping:
  enabled: false
  patience: 15
  min_delta: 0.001

# M4 Notes:
# - batch_size: 24 is optimized for M4 (30-40% faster than 16)
# - num_workers: 6 takes advantage of M4's improved CPU cores
# - Expected time: ~14-16 hours (vs ~20-25 on M1 Pro)
# - If you have 24GB+ RAM, try batch_size: 32 for even faster training!
# - Monitor Activity Monitor - if memory < 12GB used, increase batch_size to 28

